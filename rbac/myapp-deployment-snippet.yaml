# myapp-deployment-snippet.yaml: shows a Deployment that:
#   explicitly uses serviceAccountName: myapp (never relies on default),
#   has automountServiceAccountToken: false at pod spec level.
#
# spec.selector.matchLabels is defined (app: myapp), which is required in apps/v1 Deployments.
# spec.template.metadata.labels contains the same app: myapp label, so the selector matches the pod template labels and passes validation.
#   - uses 2 replicas for basic HA,
#   - defines simple HTTP liveness/readiness probes.
# replicas: 2
# Common guidance is to run at least two replicas in production for basic resilience against node failures and restarts.
# HTTP probes
# Using HTTP liveness/readiness probes against /healthz and /readyz is a standard practice; Kubernetes’ docs and many examples use similar endpoints to gate traffic and restarts.
#
# allowPrivilegeEscalation is explicitly set to false.
# All Linux capabilities are dropped for the container.
# runAsNonRoot: true at pod level enforces non-root UID.
# seccompProfile.type: RuntimeDefault uses the container runtime’s default seccomp profile, which is recommended for restricted environments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: team-alpha
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      serviceAccountName: myapp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: myapp
          image: ghcr.io/org/myapp@sha256:...
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5